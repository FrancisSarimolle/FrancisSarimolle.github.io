<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CBT C++: Loop & Branching Advanced</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    <style>
        :root { --primary: #2563eb; --bg: #f3f4f6; --card: #ffffff; --text: #1f2937; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        
        .container { max-width: 900px; margin: 0 auto; display: grid; grid-template-columns: 3fr 1fr; gap: 20px; }
        
        /* Area Soal */
        .quiz-area { background: var(--card); padding: 25px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .code-block { font-size: 0.9em; border-radius: 6px; margin: 15px 0; }
        
        /* Pilihan Ganda */
        .options { display: grid; gap: 10px; margin-top: 20px; }
        .option-btn {
            padding: 12px; text-align: left; border: 2px solid #e5e7eb; border-radius: 8px;
            background: white; cursor: pointer; transition: all 0.2s; font-weight: 500;
        }
        .option-btn:hover { border-color: var(--primary); background: #eff6ff; }
        .option-btn.selected { background: var(--primary); color: white; border-color: var(--primary); }

        /* Sidebar Navigasi */
        .sidebar { background: var(--card); padding: 20px; border-radius: 10px; height: fit-content; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .timer { font-size: 1.5em; font-weight: bold; text-align: center; color: #dc2626; margin-bottom: 20px; }
        .nav-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
        .nav-btn {
            padding: 8px; border: 1px solid #e5e7eb; background: white;
            border-radius: 4px; cursor: pointer; font-size: 0.9em;
        }
        .nav-btn.active { background: var(--primary); color: white; }
        .nav-btn.answered { background: #10b981; color: white; border-color: #10b981; }
        .nav-btn.active.answered { background: #059669; }

        .controls { margin-top: 25px; display: flex; justify-content: space-between; }
        .btn { padding: 10px 20px; background: var(--primary); color: white; border: none; border-radius: 6px; cursor: pointer; }
        .btn-secondary { background: #6b7280; }
        
        /* Hasil */
        #result-screen { display: none; text-align: center; }
        .score-display { font-size: 3em; font-weight: bold; color: var(--primary); }
    </style>
</head>
<body>

<div class="container" id="quiz-container">
    <div class="quiz-area">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h2 id="q-number">Soal 1</h2>
            <span style="font-size:0.9em; color:#666">Topic: Advanced Logic</span>
        </div>
        <p id="q-text">Perhatikan kode berikut. Apa output yang dihasilkan?</p>
        
        <pre class="line-numbers"><code id="q-code" class="language-cpp"></code></pre>
        
        <div class="options" id="options-container">
            </div>

        <div class="controls">
            <button class="btn btn-secondary" onclick="prevQuestion()">Sebelumnya</button>
            <button class="btn" onclick="nextQuestion()" id="btn-next">Selanjutnya</button>
            <button class="btn" onclick="finishQuiz()" id="btn-finish" style="display:none; background:#dc2626;">Selesai Ujian</button>
        </div>
    </div>

    <div class="sidebar">
        <div class="timer" id="timer">60:00</div>
        <div style="margin-bottom:10px; font-size:0.9em;">Navigasi Soal:</div>
        <div class="nav-grid" id="nav-grid">
            </div>
    </div>
</div>

<div class="container" id="result-screen">
    <div class="quiz-area" style="text-align: center; width: 100%;">
        <h1>Ujian Selesai</h1>
        <p>Nilai Akhir Anda:</p>
        <div class="score-display" id="final-score">0</div>
        <p id="correct-count"></p>
        <button class="btn" onclick="location.reload()">Ulangi Ujian</button>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-core.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>

<script>
    // ==========================================
    // DATABASE SOAL (5 Contoh Soal Kompleks)
    // ==========================================
    const questions = [
        {
            code: `
#include <iostream>
using namespace std;

int main() {
    int x = 0;
    for (int i = 0; i < 5; i++) {
        if (i % 2 == 0) continue;
        for (int j = 0; j <= i; j++) {
            x += j;
            if (x > 5) break;
        }
    }
    cout << x;
    return 0;
}`,
            options: ["3", "6", "7", "8", "Infinite Loop"],
            answer: 2 // Index jawaban (mulai dari 0). Jadi "7" adalah jawaban benar.
        },
        {
            code: `
#include <iostream>
using namespace std;

int main() {
    int a = 5, b = 10;
    while (b > 0) {
        if (b % 3 == 0) {
            b -= 2;
            continue;
        }
        a += (b--);
        if (a > 20) break;
    }
    cout << a << " " << b;
}`,
            options: ["24 4", "22 6", "25 4", "21 6", "Runtime Error"],
            answer: 1 
        },
        {
            code: `
#include <iostream>
using namespace std;

int main() {
    int p = 1, q = 2;
    for (int i = 0; i < 3; ++i) {
        switch (p + i) {
            case 1: q++; break;
            case 2: q += 2;
            case 3: q--; break;
            default: q = 0;
        }
        p += q;
    }
    cout << p;
}`,
            options: ["8", "11", "15", "12", "4"],
            answer: 4
        },
        {
            code: `
#include <iostream>
using namespace std;

int main() {
    int x = 10;
    do {
        x--;
        if (x == 6) {
            x -= 2;
            continue;
        }
        cout << x << " ";
    } while (x > 4);
}`,
            options: ["9 8 7 5 4", "9 8 7 4", "9 8 7 5", "9 8 7", "Infinite Loop"],
            answer: 3
        },
        {
            code: `
#include <iostream>
using namespace std;

int main() {
    int i, j;
    for(i = 0, j = 10; i < j; i++, j--) {
        if (i == 2) continue;
        if (j == 7) break;
        cout << i << j << " ";
    }
}`,
            options: ["010 19 37", "010 19", "010 19 36", "010 19 28", "010 19 37 46"],
            answer: 1
        }
    ];

    // ==========================================
    // ENGINE LOGIC (Jangan diubah kecuali paham)
    // ==========================================
    let currentIdx = 0;
    let userAnswers = new Array(questions.length).fill(null);
    let timeLeft = 60 * 60; // 60 Menit

    const timerEl = document.getElementById('timer');
    const qNumberEl = document.getElementById('q-number');
    const qCodeEl = document.getElementById('q-code');
    const optionsEl = document.getElementById('options-container');
    const navGridEl = document.getElementById('nav-grid');
    
    // Init
    function init() {
        renderNav();
        loadQuestion(0);
        startTimer();
    }

    // Render Navigasi
    function renderNav() {
        navGridEl.innerHTML = '';
        questions.forEach((_, idx) => {
            const btn = document.createElement('button');
            btn.className = `nav-btn ${idx === currentIdx ? 'active' : ''} ${userAnswers[idx] !== null ? 'answered' : ''}`;
            btn.innerText = idx + 1;
            btn.onclick = () => loadQuestion(idx);
            navGridEl.appendChild(btn);
        });
    }

    // Load Soal
    function loadQuestion(idx) {
        currentIdx = idx;
        const q = questions[idx];
        
        qNumberEl.innerText = `Soal ${idx + 1} dari ${questions.length}`;
        qCodeEl.textContent = q.code;
        
        // Trigger Prism Highlight
        Prism.highlightElement(qCodeEl);

        optionsEl.innerHTML = '';
        q.options.forEach((opt, optIdx) => {
            const btn = document.createElement('button');
            btn.className = `option-btn ${userAnswers[idx] === optIdx ? 'selected' : ''}`;
            btn.innerText = `${String.fromCharCode(65 + optIdx)}. ${opt}`;
            btn.onclick = () => selectAnswer(optIdx);
            optionsEl.appendChild(btn);
        });

        // Update Tombol Next/Finish
        document.getElementById('btn-next').style.display = (idx === questions.length - 1) ? 'none' : 'inline-block';
        document.getElementById('btn-finish').style.display = (idx === questions.length - 1) ? 'inline-block' : 'none';
        
        renderNav();
    }

    // Pilih Jawaban
    function selectAnswer(optIdx) {
        userAnswers[currentIdx] = optIdx;
        renderNav();
        // Update UI visual selection immediately
        const opts = document.querySelectorAll('.option-btn');
        opts.forEach(b => b.classList.remove('selected'));
        opts[currentIdx].children[optIdx]?.classList.add('selected'); // bug fix logic slightly off here, easier to reload
        loadQuestion(currentIdx); // Reload to refresh state cleanly
    }

    function nextQuestion() {
        if (currentIdx < questions.length - 1) loadQuestion(currentIdx + 1);
    }

    function prevQuestion() {
        if (currentIdx > 0) loadQuestion(currentIdx - 1);
    }

    // Timer
    function startTimer() {
        const interval = setInterval(() => {
            timeLeft--;
            const m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
            const s = (timeLeft % 60).toString().padStart(2, '0');
            timerEl.innerText = `${m}:${s}`;
            
            if (timeLeft <= 0) {
                clearInterval(interval);
                finishQuiz();
            }
        }, 1000);
    }

    // Hitung Nilai
    function finishQuiz() {
        if(!confirm("Apakah Anda yakin ingin mengakhiri ujian?")) return;

        let score = 0;
        questions.forEach((q, idx) => {
            if (userAnswers[idx] === q.answer) score++;
        });

        const finalScore = Math.round((score / questions.length) * 100);
        
        document.getElementById('quiz-container').style.display = 'none';
        document.getElementById('result-screen').style.display = 'block';
        document.getElementById('final-score').innerText = finalScore;
        document.getElementById('correct-count').innerText = `Benar ${score} dari ${questions.length} soal`;
    }

    // Mulai
    init();
</script>

</body>
</html>
